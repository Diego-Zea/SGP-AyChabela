name: CD

# Publica la imagen de la aplicacion cada vez que main cambia.
# La imagen queda en el registro de contenedores de GitHub (ghcr.io),
# desde donde la toma el entorno de despliegue en la nube.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  publicar-imagen:
    name: Construir y publicar la imagen
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar el nombre de la imagen
        run: |
          # El nombre de una imagen Docker tiene que ir en minusculas y el del
          # repositorio lleva mayusculas, asi que se convierte aqui.
          echo "IMAGEN=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Iniciar sesion en ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:${{ github.sha }}

      - name: Resumen
        run: |
          echo "### Imagen publicada" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGEN }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGEN }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
